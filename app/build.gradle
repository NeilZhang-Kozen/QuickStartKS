plugins {
//    alias(libs.plugins.android.application)

    id 'com.android.application'
    id 'com.yanzhenjie.andserver'
}

android {
    namespace 'com.kozen.quickstartks'
    compileSdk 34

    defaultConfig {
        applicationId "com.kozen.quickstartks_new"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "1.3.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation files('libs/FinancialLib_1.2.2_release.aar')
    implementation files('libs/ComponentLib_1.2.4_release.aar')
    implementation files('libs/com.pos.sdk_release.jar')
    implementation 'com.google.firebase:firebase-database:21.0.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'com.yanzhenjie.andserver:api:2.1.12'
    annotationProcessor 'com.yanzhenjie.andserver:processor:2.1.12'
}